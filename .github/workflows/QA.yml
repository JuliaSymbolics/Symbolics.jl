name: QA

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - name: Run strict SciMLTesting QA
        run: julia --startup-file=no --project=test/qa -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); include("test/qa/qa.jl")'
